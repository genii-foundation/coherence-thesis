name: CI

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # This display name is a protected status context. Keep it stable even
    # though the browser matrix now owns the production builds.
    name: Validate (types, lint, unit, build, drift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve live pull request base
        id: pull-request-base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          live_base_sha="$(git rev-parse "origin/$BASE_REF")"
          if ! git merge-base --is-ancestor "$live_base_sha" "$HEAD_SHA"; then
            echo "::error::Pull request head $HEAD_SHA does not contain current $BASE_REF at $live_base_sha. Refresh the branch before validation."
            exit 1
          fi
          echo "sha=$live_base_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Materialize manuscript outputs from source
        run: npm run manuscripts:prepare

      - name: Validate repository structure, links, and agent assets
        run: |
          npm run --ignore-scripts repository:validate-layout
          npm run --ignore-scripts repository:validate-agents
          npm run --ignore-scripts repository:validate-links
          npm run --ignore-scripts repository:source-boundary
          npm run --ignore-scripts readme:check

      - name: Validate editorial debt
        run: npm run --ignore-scripts editorial:debt

      - name: Validate editorial evidence
        run: npm run --ignore-scripts editorial:validate

      - name: Validate reviewed semantic links
        run: npm run --ignore-scripts editorial:semantic-links:validate

      - name: Validate manuscript references and artifact freshness
        run: npm run --ignore-scripts manuscripts:validate

      - name: Block manuscript publication with stale audio
        run: npm run --ignore-scripts audio:verify-manuscript-publication -- --base "$AUDIO_PUBLICATION_BASE_SHA"
        env:
          AUDIO_PUBLICATION_BASE_SHA: ${{ github.event_name == 'pull_request' && steps.pull-request-base.outputs.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}

      - name: Type check
        run: npm run --ignore-scripts typecheck

      - name: Lint
        run: npm run --ignore-scripts lint

      - name: Unit tests with coverage
        run: npm run --ignore-scripts test:coverage

      - name: Check source and durable publishing state remain clean
        run: |
          npm run --ignore-scripts repository:source-boundary
          if ! git diff --exit-code -- editorial publishing; then
            echo "::error::Automatic generation changed editorial or publishing state. Run an explicit reviewed write workflow and commit the intended result."
            exit 1
          fi

      - name: Dependency audit (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  browser-impact:
    name: Classify browser impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_e2e: ${{ steps.browser-impact.outputs.run_e2e }}
      updates_required_sha: ${{ steps.browser-revisions.outputs.updates_required_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve live pull request base
        id: pull-request-base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          live_base_sha="$(git rev-parse "origin/$BASE_REF")"
          if ! git merge-base --is-ancestor "$live_base_sha" "$HEAD_SHA"; then
            echo "::error::Pull request head $HEAD_SHA does not contain current $BASE_REF at $live_base_sha. Refresh the branch before validation."
            exit 1
          fi
          echo "sha=$live_base_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Resolve browser revisions
        id: browser-revisions
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && steps.pull-request-base.outputs.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
          UPDATES_REQUIRED_SHA: ${{ github.event_name == 'pull_request' && steps.pull-request-base.outputs.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
        run: |
          echo "base_sha=$CI_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$CI_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "updates_required_sha=$UPDATES_REQUIRED_SHA" >> "$GITHUB_OUTPUT"

      - name: Classify browser impact
        id: browser-impact
        run: >-
          node scripts/repository/ci-browser-impact.mjs
          --base "$CI_BASE_SHA"
          --head "$CI_HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
        env:
          CI_BASE_SHA: ${{ steps.browser-revisions.outputs.base_sha }}
          CI_HEAD_SHA: ${{ steps.browser-revisions.outputs.head_sha }}

      - name: Explain focused validation
        if: steps.browser-impact.outputs.run_e2e != 'true'
        run: echo "Skipping production build and Playwright because $CI_BROWSER_REASON"
        env:
          CI_BROWSER_REASON: ${{ steps.browser-impact.outputs.reason }}

  e2e-shards:
    name: Playwright shard ${{ matrix.shard }} of 4
    needs: browser-impact
    if: needs.browser-impact.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    container:
      # Keep this exact version aligned with @playwright/test. A focused test
      # fails when Dependabot advances one without the other.
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checked-out workspace in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Materialize manuscript outputs from source
        run: npm run manuscripts:prepare

      - name: Build production application
        run: npm run --ignore-scripts build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATES_REQUIRED_HEAD_SHA: ${{ needs.browser-impact.outputs.updates_required_sha }}
          UPDATES_REFRESH_DEPLOYMENTS: "false"

      - name: Check queued Updates fallback cache is current
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: npm run --ignore-scripts updates:verify -- "$UPDATES_REQUIRED_HEAD_SHA"
        env:
          UPDATES_REQUIRED_HEAD_SHA: ${{ needs.browser-impact.outputs.updates_required_sha }}

      - name: Verify Updates includes the main push
        if: github.event_name == 'push'
        run: npm run --ignore-scripts updates:verify:generated -- "$GITHUB_SHA"

      - name: Check the build preserved editorial and publishing state
        run: |
          if ! git diff --exit-code -- editorial publishing; then
            echo "::error::The production build modified editorial or publishing state. Build output must remain disposable."
            exit 1
          fi

      - name: Run Playwright shard
        run: npm run test:e2e:built -- --shard=${{ matrix.shard }}/4
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  e2e:
    # This stable display name is the protected browser status. The aggregate
    # passes only when the candidate build and every requested shard pass.
    name: End-to-end (Playwright)
    needs: [browser-impact, e2e-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete browser gate
        env:
          BROWSER_IMPACT_RESULT: ${{ needs.browser-impact.result }}
          RUN_E2E: ${{ needs.browser-impact.outputs.run_e2e }}
          SHARD_RESULT: ${{ needs.e2e-shards.result }}
        run: |
          if [ "$BROWSER_IMPACT_RESULT" != "success" ]; then
            echo "::error::Browser impact classification finished with $BROWSER_IMPACT_RESULT."
            exit 1
          fi
          if [ "$RUN_E2E" = "true" ] && [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::The Playwright shard matrix finished with $SHARD_RESULT."
            exit 1
          fi
          if [ "$RUN_E2E" != "true" ] && [ "$SHARD_RESULT" != "skipped" ]; then
            echo "::error::Playwright was classified as unnecessary, but the shard matrix finished with $SHARD_RESULT."
            exit 1
          fi
          echo "The complete browser gate passed."
